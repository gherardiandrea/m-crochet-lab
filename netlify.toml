[build]
  command = "npm install && npm run prod && ./vendor/bin/jigsaw build production"
  publish = "build_production"

[build.environment]
  PHP_VERSION = "8.2"
  NODE_VERSION = "20"

# Il CSS è versionato da Mix (?id=hash) e i font non cambiano: cache di un anno.
[[headers]]
  for = "/assets/build/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le foto possono essere sostituite mantenendo il nome: cache di un giorno.
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
